<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe3f1">
<title>Truth or Dare</title>
<style>
  :root {
    --bg1: #ffe3f1;
    --bg2: #e6dcff;
    --card: rgba(255, 255, 255, 0.92);
    --ink: #3b2a4d;
    --muted: #8b7a9e;
    --pink: #ff6fae;
    --purple: #8b6cff;
    --shadow: 0 10px 30px rgba(120, 80, 170, 0.15);
    --inputbg: #fff;
    --inputborder: #e4d9ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
    transition: background 0.3s ease, color 0.3s ease;
  }
  #app { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 34px; margin: 8px 0 4px; text-align: center; }
  #mascot { font-size: 38px; text-align: center; margin: 0 0 4px; transition: transform 0.25s ease; display: block; }
  #mascot.bounce { animation: mascotBounce 0.5s ease; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: 17px; }
  .card { background: var(--card); border-radius: 24px; padding: 22px; box-shadow: var(--shadow); margin-bottom: 16px; }
  #app.enter .card { animation: fade 0.35s ease both; }
  .center { text-align: center; }
  .label { font-weight: 700; margin: 0 0 12px; font-size: 18px; }
  .hint { color: var(--muted); margin: 12px 0; font-size: 15px; }
  .gap { height: 12px; }
  button { font: inherit; border: 0; cursor: pointer; }
  .btn {
    width: 100%; padding: 16px 18px; border-radius: 18px; font-weight: 700; font-size: 18px; color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    box-shadow: 0 8px 20px rgba(139, 108, 255, 0.35); transition: transform 0.12s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn.ghost { background: var(--inputbg); color: var(--purple); box-shadow: inset 0 0 0 2px var(--inputborder); }
  .btn.green { background: linear-gradient(135deg, #35c58a, #22a06b); box-shadow: 0 8px 20px rgba(53, 197, 138, 0.35); }
  .btn.truth { background: linear-gradient(135deg, #ff8ac0, #ff5c9d); box-shadow: 0 8px 20px rgba(255, 92, 157, 0.35); }
  .btn.dare { background: linear-gradient(135deg, #9d85ff, #6d4dff); }
  .btn.small { padding: 12px 14px; font-size: 15px; border-radius: 14px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .row2.tight { margin-top: 0; }
  input[type=text], input[type=password], input[type=number], textarea {
    width: 100%; padding: 15px 16px; font: inherit; font-size: 18px; border-radius: 16px;
    border: 2px solid var(--inputborder); background: var(--inputbg); color: var(--ink); outline: none;
  }
  textarea { resize: vertical; line-height: 1.4; }
  input:focus, textarea:focus { border-color: var(--purple); }
  .code { font-size: 30px; font-weight: 800; letter-spacing: 4px; text-align: center; color: var(--purple); }
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .score {
    background: var(--card); border-radius: 22px; padding: 14px 10px; text-align: center; box-shadow: var(--shadow);
    border: 3px solid transparent; transition: border-color 0.3s, transform 0.3s;
  }
  .score.active { border-color: var(--pink); transform: translateY(-2px); }
  .score.winner { border-color: #f5b942; }
  .pname { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pts { font-size: 40px; font-weight: 800; color: var(--purple); }
  .pts.bump { animation: bump 0.6s ease; }
  .turn { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
  .turncard.swap { animation: turnSwap 0.45s ease both; }
  .waiting { color: var(--muted); font-size: 17px; margin: 6px 0 14px; }
  .dots { animation: pulse 1.2s ease-in-out infinite; display: inline-block; }
  .qcard { text-align: center; padding: 26px 20px; perspective: 900px; }
  .qcard.pop { animation: flipIn 0.5s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
  .badge { display: inline-block; padding: 6px 14px; border-radius: 999px; font-weight: 800; letter-spacing: 1px; font-size: 13px; color: #fff; margin-bottom: 14px; }
  .badge.truth { background: var(--pink); }
  .badge.dare { background: var(--purple); }
  .badge.custom { background: #f5b942; }
  .qtext { font-size: 24px; line-height: 1.3; font-weight: 700; word-wrap: break-word; }
  .answer { border-left: 6px solid var(--pink); }
  .alabel { font-weight: 700; color: var(--muted); margin: 0 0 8px; font-size: 15px; }
  .atext { font-size: 20px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .progress { text-align: center; color: var(--muted); font-size: 14px; margin: -8px 0 16px; }
  .progress.big { font-size: 19px; font-weight: 800; color: var(--purple); margin: -6px 0 8px; }
  .finalbadge { text-align: center; font-weight: 800; color: var(--pink); margin: -2px 0 14px; font-size: 15px; }
  .footer { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .linkbtn { display: inline-block; margin: 14px 0 0; background: none; color: var(--muted); text-decoration: underline; font-size: 16px; padding: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; border: 2px solid var(--inputborder); background: var(--inputbg); font-weight: 700; font-size: 15px; color: var(--purple); margin: 0 8px 8px 0; }
  .chip.on { background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; border-color: transparent; }
  .avatarchip { font-size: 22px; padding: 8px 12px; }
  .avatarchip.on { transform: scale(1.15); box-shadow: 0 4px 14px rgba(139, 108, 255, 0.4); }
  .streakbadge { text-align: center; font-weight: 800; color: var(--pink); margin: -6px 0 14px; font-size: 15px; }
  .chiprow { display: flex; flex-wrap: wrap; margin-bottom: 4px; }
  .segrow { display: flex; border-radius: 16px; overflow: hidden; border: 2px solid var(--inputborder); margin-bottom: 4px; }
  .seg { flex: 1; padding: 12px; text-align: center; font-weight: 700; background: var(--inputbg); color: var(--purple); font-size: 15px; }
  .seg.on { background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; }
  .checklist { max-height: 340px; overflow-y: auto; border: 2px solid var(--inputborder); border-radius: 16px; padding: 10px; }
  .cgroup { font-weight: 800; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin: 10px 4px 4px; }
  .citem { display: flex; align-items: flex-start; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--inputborder); font-size: 15px; }
  .citem:last-child { border-bottom: none; }
  .citem input { width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0; }
  .ckind { font-weight: 800; font-size: 11px; padding: 2px 8px; border-radius: 999px; color: #fff; margin-right: 6px; flex-shrink: 0; }
  .ckind.truth { background: var(--pink); }
  .ckind.dare { background: var(--purple); }
  .pickcount { text-align: center; font-weight: 800; color: var(--purple); margin: 10px 0; font-size: 16px; }
  .dragon { font-size: 64px; text-align: center; margin: 0 0 6px; }
  .winnername { font-size: 28px; font-weight: 800; text-align: center; margin: 4px 0; }
  #toast {
    display: none; position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(24px, env(safe-area-inset-bottom)); background: #3b2a4d; color: #fff;
    padding: 12px 18px; border-radius: 16px; font-size: 15px; max-width: 90%; z-index: 10; text-align: center;
  }
  body.busy .btn { opacity: 0.6; pointer-events: none; }
  #sparkles { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  #sparkles span {
    position: absolute; bottom: -10%; font-size: 16px; opacity: 0;
    animation: floatUp linear infinite;
  }
  #app { position: relative; z-index: 1; }
  .progressbar { height: 8px; border-radius: 999px; background: rgba(139, 108, 255, 0.15); overflow: hidden; margin: -4px 0 16px; }
  .progressbar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--pink), var(--purple)); transition: width 0.4s ease; }
  .confetti-piece { position: fixed; top: -20px; border-radius: 2px; pointer-events: none; z-index: 20; animation: confettiFall linear forwards; }
  .float-emoji { position: fixed; bottom: 22%; font-size: 48px; z-index: 25; pointer-events: none; animation: floatEmojiRise 1.5s ease-out forwards; }
  .chatlog { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .bubblewrap { display: flex; }
  .bubblewrap.mine { justify-content: flex-end; }
  .bubble { background: var(--inputbg); border: 2px solid var(--inputborder); border-radius: 16px; padding: 10px 14px; max-width: 75%; font-size: 15px; word-wrap: break-word; }
  .bubble.mine { background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; border-color: transparent; }
  .bubblename { font-size: 11px; font-weight: 800; color: var(--muted); margin-bottom: 2px; }
  .reactrow { margin: -4px 0 4px; justify-content: center; }
  .reactchip { font-size: 22px; padding: 8px 10px; }
  .chatdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pink); margin-left: 4px; vertical-align: middle; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes flipIn {
    0% { transform: rotateY(-90deg) scale(0.95); opacity: 0; }
    60% { transform: rotateY(8deg) scale(1.02); opacity: 1; }
    100% { transform: rotateY(0deg) scale(1); opacity: 1; }
  }
  @keyframes mascotBounce {
    0% { transform: scale(1) translateY(0); }
    30% { transform: scale(1.3) translateY(-8px); }
    60% { transform: scale(0.95) translateY(2px); }
    100% { transform: scale(1) translateY(0); }
  }
  @keyframes turnSwap {
    0% { opacity: 0; transform: translateX(28px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.7; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-110vh) translateX(20px) rotate(180deg); opacity: 0; }
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(540deg); opacity: 0; }
  }
  @keyframes floatEmojiRise {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    15% { opacity: 1; transform: scale(1.15); }
    100% { transform: translateY(-160px) scale(1); opacity: 0; }
  }
</style>
</head>
<body>
<div id="sparkles"></div>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://sislhijujxzjinasqvwl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_pz3O9UDi6pnmT2YN2n-23A_pSG9_M4n";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const app = document.getElementById("app");
  const CATS = ["friend", "partner", "relationship", "general"];
  const AVATARS = ["🦄", "🐱", "🐶", "🦊", "🐼", "😎", "👑", "🔥", "🌸", "⭐", "🐲", "🦁", "🐨", "🐸", "🦋", "🍓", "🍑", "🎲", "💋", "😈"];
  const CATLABEL = { friend: "Friend", partner: "Partner", relationship: "Relationship", general: "General" };
  const SPICE = { friend: 1, general: 1, relationship: 3, partner: 4 };
  const QUICK_REACTIONS = ["❤️", "😂", "😮", "😢", "🔥", "👏", "😜", "😱", "😬", "😰", "😤", "🫣", "🤔", "🤫", "😳", "🥹", "🤢", "😉", "🤐", "😋", "🤓", "🥳", "🤪", "🥵"];


  let userId = null;
  let game = null;
  let players = [];
  let channel = null;
  let pollTimer = null;
  let screen = "loading";
  let pendingAction = "create";
  let joinCode = "";
  let busy = false;
  let lastSnap = "";
  let lastScreenKey = "";
  let lastQuestionKey = "";
  let lastScores = {};
  let toastTimer = null;
  let addKind = "truth";
  let addCategory = "friend";
  let addReturn = "home";
  let addMode = "add";
  let deleteCats = { friend: true, partner: true, relationship: true, general: true };
  let deletePicks = {};
  let ownerPass = "";
  let draftName = "";
  let draftPass = "";
  let draftAvatar = AVATARS[Math.floor(Math.random() * AVATARS.length)];
  let setupCats = { friend: true, partner: true, relationship: true, general: true };
  let setupMode = "random";
  let setupCount = "50";
  let setupRounds = "20";
  let manualPicks = {};
  let pickerQuestions = null;
  let pickerLoading = false;
  let showGiveCustom = false;
  let soundOn = load("tod_sound") !== "0";
  let audioCtx = null;
  let lastChoosingKey = "";
  let lastFinishedId = "";
  let lastChatLen = 0;
  let lastReadChatLen = 0;

  async function ensureAudio() {
    if (!soundOn) return;
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // iOS Safari needs an actual sound (even silent) played inside the
        // user-gesture handler to fully unlock audio for later JS-triggered sounds.
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
      } catch (e) { audioCtx = null; return; }
    }
    if (audioCtx.state !== "running") {
      try { await audioCtx.resume(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state !== "running") {
      // Still stuck asleep (iOS sometimes does this after the page has been
      // idle) - drop it so the next attempt builds a brand new one.
      try { audioCtx.close(); } catch (e) {}
      audioCtx = null;
    }
  }
  function tone(freq, start, dur, type, vol) {
    if (!soundOn || !audioCtx || audioCtx.state !== "running") return;
    try {
      const t0 = audioCtx.currentTime + start;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol || 0.22, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (e) {}
  }
  // Sound is intentionally minimal: one soft tick when a new question appears,
  // and one short gentle chime on a win. Nothing plays for turn-start, complete or skip.
  // Each call re-checks the audio system is actually awake before playing.
  function playReveal() { ensureAudio().then(function () { tone(700, 0, 0.09, "sine", 0.1); }); }
  function playWin() {
    ensureAudio().then(function () {
      const notes = [659, 880, 1047];
      notes.forEach(function (f, i) { tone(f, i * 0.12, 0.16, "sine", 0.1); });
    });
  }
  function playMessage() {
    ensureAudio().then(function () {
      tone(520, 0, 0.07, "sine", 0.08);
      tone(760, 0.06, 0.09, "sine", 0.08);
    });
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function store(k, v) {
    try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {}
  }
  function load(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function toast(msg) {
    let t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = "none"; }, 3500);
  }
  function setBusy(b) {
    busy = b;
    document.body.classList.toggle("busy", b);
  }
  async function rpc(name, args) {
    if (busy) return { error: { message: "Please wait a moment..." } };
    setBusy(true);
    try {
      const res = await client.rpc(name, args);
      if (res.error) return { error: { message: res.error.message || "Something went wrong" } };
      return res;
    } catch (e) {
      return { error: { message: (e && e.message) || "Something went wrong" } };
    } finally {
      setBusy(false);
    }
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function inviteLink(code) {
    return location.origin + location.pathname + "?code=" + encodeURIComponent(code);
  }

  async function loadState(id) {
    const gid = id || (game && game.id);
    if (!gid) return false;
    try {
      const results = await Promise.all([
        client.from("games").select("*").eq("id", gid).maybeSingle(),
        client.from("players").select("*").eq("game_id", gid).order("seat")
      ]);
      const g = results[0];
      const p = results[1];
      if (g.error || p.error || !g.data) return false;
      game = g.data;
      players = p.data || [];
      return true;
    } catch (e) {
      return false;
    }
  }
  async function refresh() {
    if (!(await loadState())) return;
    processChat();
    const snap = JSON.stringify([game, players]);
    if (snap !== lastSnap) {
      lastSnap = snap;
      if (screen === "game" || screen === "chat") render();
    }
  }
  function subscribe(id) {
    if (channel) { client.removeChannel(channel); channel = null; }
    channel = client
      .channel("game-" + id)
      .on("postgres_changes", { event: "*", schema: "public", table: "games", filter: "id=eq." + id }, refresh)
      .on("postgres_changes", { event: "*", schema: "public", table: "players", filter: "game_id=eq." + id }, refresh)
      .subscribe();
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(refresh, 4000);
  }
  async function enterGame(id) {
    const ok = await loadState(id);
    if (!ok) return false;
    lastSnap = JSON.stringify([game, players]);
    lastScores = {};
    lastChatLen = (game.chat || []).length;
    lastReadChatLen = lastChatLen;
    store("tod_game_id", game.id);
    try { history.replaceState(null, "", location.pathname + "?code=" + encodeURIComponent(game.code)); } catch (e) {}
    screen = "game";
    showGiveCustom = false;
    subscribe(game.id);
    render();
    return true;
  }

  function header(mood, bounce) {
    return '<div id="mascot"' + (bounce ? ' class="bounce"' : '') + '>' + (mood || "🐉") + "</div>" +
      "<h1>💌 Truth or Dare</h1>";
  }
  function footer(withNew) {
    const chatBtn = game
      ? '<button class="linkbtn" data-action="openChat">💬 Chat' + (hasUnreadChat() ? '<span class="chatdot"></span>' : "") + "</button>"
      : "";
    return '<div class="footer"><button class="linkbtn" data-action="openAdd">Add questions</button>' +
      chatBtn +
      (withNew ? '<button class="linkbtn" data-action="newGame">New Game</button>' : "") +
      '<button class="linkbtn" data-action="toggleSound">' + (soundOn ? "🔊 Sound on" : "🔇 Muted") + "</button></div>";
  }

  function viewHome() {
    return header() + '<p class="sub">A private game for two</p>' +
      '<div class="card"><button class="btn" data-action="goCreate">Create Game</button></div>' +
      '<div class="card"><p class="label">Have a room code?</p>' +
      '<input type="text" id="codeInput" placeholder="Enter code" autocapitalize="characters" autocomplete="off" maxlength="20">' +
      '<div class="gap"></div><button class="btn ghost" data-action="goJoinCode">Join Game</button></div>' +
      footer(false);
  }
  function viewName() {
    const joining = pendingAction === "join";
    let html = header() +
      '<p class="sub">' + (joining ? "Room " + esc(joinCode) : "Create a private room") + "</p>" +
      '<div class="card"><p class="label">What is your name?</p>' +
      '<input type="text" id="nameInput" maxlength="20" placeholder="Your name" autocomplete="off">';
    html += '<div class="gap"></div><p class="label">Pick your icon</p><div class="chiprow">' +
      AVATARS.map(function (a) {
        const on = draftAvatar === a;
        return '<button class="chip avatarchip' + (on ? " on" : "") + '" data-action="pickAvatar" data-avatar="' + a + '">' + a + "</button>";
      }).join("") + "</div>";
    if (!joining) {
      html += '<div class="gap"></div><p class="label">Owner passcode</p>' +
        '<input type="password" id="passInput" placeholder="Owner passcode" autocomplete="off" value="' + esc(ownerPass) + '">' +
        '<p class="hint">Only the owner has this passcode.</p>';
    }
    html += '<div class="gap"></div><button class="btn" data-action="submitName">' + (joining ? "Join Game" : "Next") + "</button>" +
      '<div class="gap"></div><button class="btn ghost" data-action="back">Back</button></div>';
    return html;
  }

  function catCount(cat, kind) {
    if (!pickerQuestions) return 0;
    return pickerQuestions.filter(function (q) { return q.category === cat && (!kind || q.kind === kind); }).length;
  }
  function selectedCatsList() {

    const oldName = document.getElementById("nameInput");
    const draftNameVal = oldName ? oldName.value : "";
    const oldNameFocused = oldName && document.activeElement === oldName;
    const oldFriend = document.getElementById("friendInput");
    const draftFriendVal = oldFriend ? oldFriend.value : "";
    const oldFriendFocused = oldFriend && document.activeElement === oldFriend;
    const oldList = document.querySelector(".checklist");
    const scrollTop = oldList ? oldList.scrollTop : 0;
    app.className = key !== lastScreenKey ? "enter" : "";
    lastScreenKey = key;
    app.innerHTML = html;
    const newBox = document.getElementById("answerBox");
    if (newBox && draftAns) newBox.value = draftAns;
    const newCustom = document.getElementById("customText");
    if (newCustom && draftCustom) newCustom.value = draftCustom;
    const newChat = document.getElementById("chatBox");
    if (newChat && draftChat) {
      newChat.value = draftChat;
      if (oldChatFocused) { newChat.focus(); newChat.setSelectionRange(draftChat.length, draftChat.length); }
    }
    const newName = document.getElementById("nameInput");
    if (newName && draftNameVal) {
      newName.value = draftNameVal;
      if (oldNameFocused) { newName.focus(); newName.setSelectionRange(draftNameVal.length, draftNameVal.length); }
    }
    const newFriend = document.getElementById("friendInput");
    if (newFriend && draftFriendVal) {
      newFriend.value = draftFriendVal;
      if (oldFriendFocused) { newFriend.focus(); newFriend.setSelectionRange(draftFriendVal.length, draftFriendVal.length); }
    }
    const newList = document.querySelector(".checklist");
    if (newList && scrollTop) newList.scrollTop = scrollTop;
    const chatlog = document.getElementById("chatlog");
    if (chatlog) chatlog.scrollTop = chatlog.scrollHeight;
  }

  async function loadPicker() {
    if (pickerQuestions || pickerLoading) return;
    pickerLoading = true;
    const res = await client.rpc("list_questions_for_picker", { kinds: ["truth", "dare"], categories: null });
    pickerLoading = false;
    if (!res.error) {
      pickerQuestions = res.data || [];
      if (screen === "setup" || screen === "add") render();
    }
  }

  async function applyAvatar() {
    try {
      const me = players.find(function (p) { return p.user_id === userId; });
      if (me && me.avatar !== draftAvatar) {
        await client.rpc("set_avatar", { pid: me.id, emoji: draftAvatar });
        me.avatar = draftAvatar;
      }
    } catch (e) {}
  }
  async function submitName() {
    const input = document.getElementById("nameInput");
    const name = (input ? input.value : "").trim();
    if (!name) { toast("Please type your name"); return; }
    store("tod_name", name);
    if (pendingAction === "join") {
      const res = await rpc("join_game", { game_code: joinCode, player_name: name });
      if (res.error) { toast(res.error.message); return; }
      const ok = await enterGame(res.data);
      if (!ok) { toast("Could not open the game. Please try again."); return; }
      await applyAvatar();
      render();
      return;
    }
    const passInput = document.getElementById("passInput");
    draftName = name;
    draftPass = passInput ? passInput.value : "";
    if (!draftPass) { toast("Please enter the owner passcode"); return; }
    screen = "setup";
    render();
    loadPicker();
  }

  function toggleCat(c) { setupCats[c] = !setupCats[c]; render(); }
  function setMode(m) { setupMode = m; render(); if (m === "manual") loadPicker(); }

  function readFriendKey() {
    const el = document.getElementById("friendInput");
    return (el ? el.value : "").trim().toLowerCase();
  }
  async function createWithIds(ids, limit, friendKey) {
    const res = await rpc("create_game", { player_name: draftName, passcode: draftPass, q_limit: limit, q_ids: ids });
    if (res.error) { toast(res.error.message); return; }
    ownerPass = draftPass;
    manualPicks = {};
    if (friendKey) {
      try { await client.rpc("set_friend_key", { gid: res.data, friend_key_in: friendKey }); } catch (e) {}
    }
    const ok = await enterGame(res.data);
    if (!ok) { toast("Could not open the game. Please try again."); return; }
    await applyAvatar();
    render();
  }
  function readRounds(fallback) {
    const raw = document.getElementById("roundsInput");
    const n = raw ? parseInt(raw.value, 10) : NaN;
    if (!n || n < 2) return fallback;
    return n;
  }
  async function startWithSetup() {
    const friendKey = readFriendKey();
    if (setupMode === "random") {
      const n = parseInt(document.getElementById("countInput").value, 10);
      if (!n || n < 2) { toast("Please enter a pool size of at least 2"); return; }
      if (!pickerQuestions) { toast("Still loading questions, try again in a second"); return; }
      const pool = poolForSelectedCats();
      if (pool.length < 2) { toast("Not enough questions in those categories"); return; }
      let usable = pool;
      if (friendKey) {
        const usedRes = await client.rpc("get_used_ids", { friend_key_in: friendKey });
        const usedIds = (usedRes && usedRes.data) || [];
        if (usedIds.length) {
          const fresh = pool.filter(function (q) { return usedIds.indexOf(q.id) === -1; });
          if (fresh.length >= 2) usable = fresh;
          else toast("You've already asked most of these before — some questions may repeat.");
        }
      }
      const ids = shuffle(usable.map(function (q) { return q.id; })).slice(0, Math.min(n, usable.length));
      if (n > usable.length) toast("Only " + usable.length + " fresh questions available in the pool");
      const rounds = readRounds(ids.length);
      await createWithIds(ids, rounds, friendKey);
    } else {
      const ids = Object.keys(manualPicks).filter(function (k) { return manualPicks[k]; }).map(Number);
      if (ids.length < 2) { toast("Please tick at least 2 questions"); return; }
      const rounds = readRounds(ids.length);
      await createWithIds(ids, rounds, friendKey);
    }
  }
  async function skipSetup() {
    const rounds = readRounds(null);
    const friendKey = readFriendKey();
    if (!friendKey) {
      await createWithIds(null, rounds, "");
      return;
    }
    if (!pickerQuestions) { toast("Still loading questions, try again in a second"); return; }
    const pool = poolForSelectedCats();
    const usedRes = await client.rpc("get_used_ids", { friend_key_in: friendKey });
    const usedIds = (usedRes && usedRes.data) || [];
    let usable = pool;
    if (usedIds.length) {
      const fresh = pool.filter(function (q) { return usedIds.indexOf(q.id) === -1; });
      if (fresh.length >= 2) usable = fresh;
      else toast("You've already asked most of these before — some questions may repeat.");
    }
    const ids = usable.map(function (q) { return q.id; });
    await createWithIds(ids, rounds, friendKey);
  }
  async function pick(kind) {
    const res = await rpc("pick_kind", { gid: game.id, chosen_kind: kind });
    if (res.error) toast(res.error.message);
    showGiveCustom = false;
    await refresh();
    render();
  }
  async function giveRandom() {
    const res = await rpc("assign_question", { gid: game.id });
    if (res.error) toast(res.error.message);
    showGiveCustom = false;
    await refresh();
    render();
  }
  async function submitGive() {
    const ta = document.getElementById("customText");
    const text = (ta ? ta.value : "").trim();
    if (!text) { toast("Please type a question first"); return; }
    const res = await rpc("assign_question", { gid: game.id, custom_text: text });
    if (res.error) toast(res.error.message);
    showGiveCustom = false;
    await refresh();
    render();
  }
  async function sendAnswer() {
    const box = document.getElementById("answerBox");
    const text = (box ? box.value : "").trim();
    if (!text) { toast("Please type your answer first"); return; }
    const res = await rpc("submit_answer", { gid: game.id, answer_text: text });
    if (res.error) toast(res.error.message);
    await refresh();
    render();
  }
  async function complete() {
    const turnP = players.find(function (p) { return p.seat === game.turn_seat; });
    const entry = {
      kind: game.current_kind === "dare" ? "dare" : "truth",
      text: game.current_question_text,
      answer: game.current_kind !== "dare" ? (game.current_answer || null) : null,
      player: turnP ? turnP.name : "Someone"
    };
    const res = await rpc("complete_challenge", { gid: game.id });
    if (res.error) { toast(res.error.message); return; }
    try { await client.rpc("bump_streak", { gid: game.id }); } catch (e) {}
    if (!game.is_repeat_round) {
      try { await client.rpc("log_history", { gid: game.id, entry: entry }); } catch (e) {}
    }
    await refresh();
    render();
  }
  async function skip() {
    const res = await rpc("skip_challenge", { gid: game.id });
    if (res.error) { toast(res.error.message); return; }
    try { await client.rpc("reset_streak", { gid: game.id }); } catch (e) {}
    await refresh();
    render();
  }
  async function saveRepeat() {
    const res = await rpc("save_repeat", { gid: game.id });
    if (res.error) { toast(res.error.message); return; }
    toast("🔁 Saved — they'll get this the moment this round ends");
    await refresh();
    render();
  }
  async function sendChat() {
    const box = document.getElementById("chatBox");
    const text = (box ? box.value : "").trim();
    if (!text) return;
    const me = players.find(function (p) { return p.user_id === userId; });
    const entry = { type: "text", from: me ? me.id : null, name: me ? me.name : "Someone", text: text, ts: Date.now() };
    if (box) box.value = "";
    try { await client.rpc("send_chat", { gid: game.id, entry: entry }); } catch (e) {}
    await refresh();
    render();
  }
  async function sendReaction(emoji) {
    const me = players.find(function (p) { return p.user_id === userId; });
    const entry = { type: "reaction", from: me ? me.id : null, name: me ? me.name : "Someone", emoji: emoji, ts: Date.now() };
    floatEmoji(emoji);
    try { await client.rpc("send_chat", { gid: game.id, entry: entry }); } catch (e) {}
    await refresh();
    render();
  }
  async function newGame() {
    if (!confirm("Start a fresh game? Scores reset and you will get a new invite link to send to your friend.")) return;
    store("tod_game_id", null);
    game = null;
    players = [];
    pendingAction = "create";
    screen = "name";
    render();
  }
  function setKind(k) { addKind = k; render(); }
  function setAddCat(c) { addCategory = c; render(); }
  function toggleDelCat(c) { deleteCats[c] = !deleteCats[c]; render(); }
  async function submitDelete() {
    const pw = document.getElementById("delPass");
    const pass = pw ? pw.value : "";
    const ids = Object.keys(deletePicks).filter(function (k) { return deletePicks[k]; }).map(Number);
    if (!ids.length) { toast("Please tick at least one question to delete"); return; }
    if (!pass) { toast("Please enter the owner passcode"); return; }
    if (!confirm("Delete " + ids.length + " question" + (ids.length === 1 ? "" : "s") + " permanently? This can't be undone.")) return;
    const res = await rpc("delete_questions", { passcode: pass, ids: ids });
    if (res.error) { toast(res.error.message); return; }
    ownerPass = pass;
    deletePicks = {};
    pickerQuestions = null;
    toast("🗑 Deleted " + (res.data || 0) + " question" + (res.data === 1 ? "" : "s"));
    await loadPicker();
  }
  async function submitAdd() {
    const ta = document.getElementById("addText");
    const pw = document.getElementById("addPass");
    const text = ta ? ta.value : "";
    const pass = pw ? pw.value : "";
    const total = text.split(/\r?\n/).filter(function (l) { return l.trim() !== ""; }).length;
    if (!total) { toast("Please type or paste at least one question"); return; }
    if (!pass) { toast("Please enter the owner passcode"); return; }
    const res = await rpc("add_questions", { passcode: pass, q_kind: addKind, q_text: text, q_category: addCategory });
    if (res.error) { toast(res.error.message); return; }
    ownerPass = pass;
    pickerQuestions = null;
    const added = res.data || 0;
    const skipped = total - added;
    toast("✅ Added " + added + " new " + addKind + " question" + (added === 1 ? "" : "s") +
      (skipped > 0 ? " (" + skipped + " skipped: duplicates or too long)" : ""));
    if (ta) ta.value = "";
  }
  async function copyText(t) {
    try {
      await navigator.clipboard.writeText(t);
      toast("Link copied ✅");
    } catch (e) {
      const box = document.getElementById("linkBox");
      if (box) { box.focus(); box.select(); box.setSelectionRange(0, 9999); }
      toast("Touch and hold the link, then tap Copy");
    }
  }
  async function shareInvite() {
    const link = inviteLink(game.code);
    if (navigator.share) {
      try {
        await navigator.share({ title: "Truth or Dare", text: "Join my private Truth or Dare game! 💌", url: link });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    copyText(link);
  }

  document.addEventListener("touchend", ensureAudio, { once: false });
  document.addEventListener("click", function (e) {
    ensureAudio();
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const a = el.dataset.action;
    if (a === "toggleSound") {
      soundOn = !soundOn;
      store("tod_sound", soundOn ? "1" : "0");
      if (soundOn) { ensureAudio(); playReveal(); }
      render();
    }
    else if (a === "goCreate") { pendingAction = "create"; screen = "name"; render(); }
    else if (a === "goJoinCode") {
      const input = document.getElementById("codeInput");
      const v = (input ? input.value : "").trim().toUpperCase();
      if (!v) { toast("Please enter the room code"); return; }
      joinCode = v; pendingAction = "join"; screen = "name"; render();
    }
    else if (a === "back") { screen = pendingAction === "join" || screen === "name" ? "home" : "name"; render(); }
    else if (a === "submitName") submitName();
    else if (a === "pickAvatar") { draftAvatar = el.dataset.avatar; render(); }
    else if (a === "toggleCat") toggleCat(el.dataset.cat);
    else if (a === "modeRandom") setMode("random");
    else if (a === "modeManual") setMode("manual");
    else if (a === "startWithSetup") startWithSetup();
    else if (a === "skipSetup") skipSetup();
    else if (a === "pick") pick(el.dataset.kind);
    else if (a === "giveRandom") giveRandom();
    else if (a === "showGive") { showGiveCustom = true; render(); }
    else if (a === "hideGive") { showGiveCustom = false; render(); }
    else if (a === "submitGive") submitGive();
    else if (a === "sendAnswer") sendAnswer();
    else if (a === "complete") complete();
    else if (a === "skip") skip();
    else if (a === "saveRepeat") saveRepeat();
    else if (a === "openChat") { screen = "chat"; render(); }
    else if (a === "closeChat") { screen = "game"; render(); }
    else if (a === "sendChat") sendChat();
    else if (a === "sendReaction") sendReaction(el.dataset.emoji);
    else if (a === "newGame") newGame();
    else if (a === "openAdd") { addReturn = screen === "game" ? "game" : "home"; screen = "add"; addMode = "add"; render(); loadPicker(); }
    else if (a === "closeAdd") { screen = addReturn; render(); }
    else if (a === "kindTruth") setKind("truth");
    else if (a === "kindDare") setKind("dare");
    else if (a === "setAddCat") setAddCat(el.dataset.cat);
    else if (a === "submitAdd") submitAdd();
    else if (a === "addModeAdd") { addMode = "add"; render(); }
    else if (a === "addModeDelete") { addMode = "delete"; render(); loadPicker(); }
    else if (a === "toggleDelCat") toggleDelCat(el.dataset.cat);
    else if (a === "submitDelete") submitDelete();
    else if (a === "share") shareInvite();
    else if (a === "copy") copyText(inviteLink(game.code));
    else if (a === "retry") location.reload();
  });
  document.addEventListener("change", function (e) {
    if (!e.target || !e.target.dataset) return;
    if (e.target.dataset.action === "toggleQ") {
      manualPicks[e.target.dataset.qid] = e.target.checked;
      render();
    } else if (e.target.dataset.action === "toggleDel") {
      deletePicks[e.target.dataset.qid] = e.target.checked;
      render();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "nameInput" || e.target.id === "passInput") submitName();
    if (e.target.id === "codeInput") {
      const btn = document.querySelector('[data-action="goJoinCode"]');
      if (btn) btn.click();
    }
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && screen === "game") refresh();
  });

  function spawnSparkles() {
    const layer = document.getElementById("sparkles");
    if (!layer) return;
    const emojis = ["✨", "💫", "⭐"];
    const count = 14;
    for (let i = 0; i < count; i++) {
      const el = document.createElement("span");
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = 10 + Math.random() * 14 + "px";
      const duration = 10 + Math.random() * 14;
      el.style.animationDuration = duration + "s";
      el.style.animationDelay = -Math.random() * duration + "s";
      layer.appendChild(el);
    }
  }
  async function boot() {
    spawnSparkles();
    render();
    try {
      let sessionResult = await client.auth.getSession();
      let session = sessionResult.data.session;
      if (!session) {
        const signIn = await client.auth.signInAnonymously();
        if (signIn.error) throw signIn.error;
        session = signIn.data.session;
      }
      userId = session.user.id;
    } catch (e) {
      window.__err = (e && e.message) || String(e);
      screen = "error";
      render();
      return;
    }

    const code = (new URLSearchParams(location.search).get("code") || "").trim().toUpperCase();
    if (code) {
      let existing = null;
      try {
        const r = await client.from("games").select("id").eq("code", code).maybeSingle();
        existing = r.data;
      } catch (e) {}
      if (existing && (await enterGame(existing.id))) return;
      joinCode = code;
      pendingAction = "join";
      screen = "name";
      render();
      return;
    }

    const saved = load("tod_game_id");
    if (saved) {
      const ok = await loadState(saved);
      if (ok && game.phase !== "finished") {
        await enterGame(saved);
        return;
      }
      store("tod_game_id", null);
      game = null;
      players = [];
    }
    screen = "home";
    render();
  }
  boot();
</script>
</body>
</html>
