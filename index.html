<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe3f1">
<title>Truth or Dare</title>
<style>
  :root {
    --bg1: #ffe3f1;
    --bg2: #e6dcff;
    --card: rgba(255, 255, 255, 0.92);
    --ink: #3b2a4d;
    --muted: #8b7a9e;
    --pink: #ff6fae;
    --purple: #8b6cff;
    --shadow: 0 10px 30px rgba(120, 80, 170, 0.15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
  }
  #app { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 34px; margin: 8px 0 4px; text-align: center; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: 17px; }
  .card { background: var(--card); border-radius: 24px; padding: 22px; box-shadow: var(--shadow); margin-bottom: 16px; }
  #app.enter .card { animation: fade 0.35s ease both; }
  .center { text-align: center; }
  .label { font-weight: 700; margin: 0 0 12px; font-size: 18px; }
  .hint { color: var(--muted); margin: 12px 0; font-size: 15px; }
  .gap { height: 12px; }
  button { font: inherit; border: 0; cursor: pointer; }
  .btn {
    width: 100%; padding: 16px 18px; border-radius: 18px; font-weight: 700; font-size: 18px; color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    box-shadow: 0 8px 20px rgba(139, 108, 255, 0.35); transition: transform 0.12s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn.ghost { background: #fff; color: var(--purple); box-shadow: inset 0 0 0 2px #e4d9ff; }
  .btn.green { background: linear-gradient(135deg, #35c58a, #22a06b); box-shadow: 0 8px 20px rgba(53, 197, 138, 0.35); }
  .btn.truth { background: linear-gradient(135deg, #ff8ac0, #ff5c9d); box-shadow: 0 8px 20px rgba(255, 92, 157, 0.35); }
  .btn.dare { background: linear-gradient(135deg, #9d85ff, #6d4dff); }
  .btn.small { padding: 12px 14px; font-size: 15px; border-radius: 14px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .row2.tight { margin-top: 0; }
  input[type=text], input[type=password], input[type=number], textarea {
    width: 100%; padding: 15px 16px; font: inherit; font-size: 18px; border-radius: 16px;
    border: 2px solid #e4d9ff; background: #fff; color: var(--ink); outline: none;
  }
  textarea { resize: vertical; line-height: 1.4; }
  input:focus, textarea:focus { border-color: var(--purple); }
  .code { font-size: 30px; font-weight: 800; letter-spacing: 4px; text-align: center; color: var(--purple); }
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .score {
    background: var(--card); border-radius: 22px; padding: 14px 10px; text-align: center; box-shadow: var(--shadow);
    border: 3px solid transparent; transition: border-color 0.3s, transform 0.3s;
  }
  .score.active { border-color: var(--pink); transform: translateY(-2px); }
  .score.winner { border-color: #f5b942; }
  .pname { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pts { font-size: 40px; font-weight: 800; color: var(--purple); }
  .pts.bump { animation: bump 0.6s ease; }
  .turn { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
  .waiting { color: var(--muted); font-size: 17px; margin: 6px 0 14px; }
  .dots { animation: pulse 1.2s ease-in-out infinite; display: inline-block; }
  .qcard { text-align: center; padding: 26px 20px; }
  .qcard.pop { animation: pop 0.45s ease both; }
  .badge { display: inline-block; padding: 6px 14px; border-radius: 999px; font-weight: 800; letter-spacing: 1px; font-size: 13px; color: #fff; margin-bottom: 14px; }
  .badge.truth { background: var(--pink); }
  .badge.dare { background: var(--purple); }
  .badge.custom { background: #f5b942; }
  .qtext { font-size: 24px; line-height: 1.3; font-weight: 700; word-wrap: break-word; }
  .answer { border-left: 6px solid var(--pink); }
  .alabel { font-weight: 700; color: var(--muted); margin: 0 0 8px; font-size: 15px; }
  .atext { font-size: 20px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .progress { text-align: center; color: var(--muted); font-size: 14px; margin: -8px 0 16px; }
  .footer { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .linkbtn { display: inline-block; margin: 14px 0 0; background: none; color: var(--muted); text-decoration: underline; font-size: 16px; padding: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; border: 2px solid #e4d9ff; background: #fff; font-weight: 700; font-size: 15px; color: var(--purple); margin: 0 8px 8px 0; }
  .chip.on { background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; border-color: transparent; }
  .chiprow { display: flex; flex-wrap: wrap; margin-bottom: 4px; }
  .segrow { display: flex; border-radius: 16px; overflow: hidden; border: 2px solid #e4d9ff; margin-bottom: 4px; }
  .seg { flex: 1; padding: 12px; text-align: center; font-weight: 700; background: #fff; color: var(--purple); font-size: 15px; }
  .seg.on { background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; }
  .checklist { max-height: 340px; overflow-y: auto; border: 2px solid #e4d9ff; border-radius: 16px; padding: 10px; }
  .cgroup { font-weight: 800; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin: 10px 4px 4px; }
  .citem { display: flex; align-items: flex-start; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #f1eaff; font-size: 15px; }
  .citem:last-child { border-bottom: none; }
  .citem input { width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0; }
  .ckind { font-weight: 800; font-size: 11px; padding: 2px 8px; border-radius: 999px; color: #fff; margin-right: 6px; flex-shrink: 0; }
  .ckind.truth { background: var(--pink); }
  .ckind.dare { background: var(--purple); }
  .pickcount { text-align: center; font-weight: 800; color: var(--purple); margin: 10px 0; font-size: 16px; }
  .dragon { font-size: 64px; text-align: center; margin: 0 0 6px; }
  .winnername { font-size: 28px; font-weight: 800; text-align: center; margin: 4px 0; }
  #toast {
    display: none; position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(24px, env(safe-area-inset-bottom)); background: #3b2a4d; color: #fff;
    padding: 12px 18px; border-radius: 16px; font-size: 15px; max-width: 90%; z-index: 10; text-align: center;
  }
  body.busy .btn { opacity: 0.6; pointer-events: none; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 60% { transform: scale(1.03); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://sislhijujxzjinasqvwl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_pz3O9UDi6pnmT2YN2n-23A_pSG9_M4n";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const app = document.getElementById("app");
  const CATS = ["friend", "partner", "relationship", "general"];
  const CATLABEL = { friend: "Friend", partner: "Partner", relationship: "Relationship", general: "General" };

  let userId = null;
  let game = null;
  let players = [];
  let channel = null;
  let pollTimer = null;
  let screen = "loading";
  let pendingAction = "create";
  let joinCode = "";
  let busy = false;
  let lastSnap = "";
  let lastScreenKey = "";
  let lastQuestionKey = "";
  let lastScores = {};
  let toastTimer = null;
  let addKind = "truth";
  let addCategory = "friend";
  let addReturn = "home";
  let addMode = "add";
  let deleteCats = { friend: true, partner: true, relationship: true, general: true };
  let deletePicks = {};
  let ownerPass = "";
  let draftName = "";
  let draftPass = "";
  let setupCats = { friend: true, partner: true, relationship: true, general: true };
  let setupMode = "random";
  let setupCount = "50";
  let setupRounds = "20";
  let manualPicks = {};
  let pickerQuestions = null;
  let pickerLoading = false;
  let showGiveCustom = false;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function store(k, v) {
    try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {}
  }
  function load(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function toast(msg) {
    let t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = "none"; }, 3500);
  }
  function setBusy(b) {
    busy = b;
    document.body.classList.toggle("busy", b);
  }
  async function rpc(name, args) {
    if (busy) return { error: { message: "Please wait a moment..." } };
    setBusy(true);
    try {
      const res = await client.rpc(name, args);
      if (res.error) return { error: { message: res.error.message || "Something went wrong" } };
      return res;
    } catch (e) {
      return { error: { message: (e && e.message) || "Something went wrong" } };
    } finally {
      setBusy(false);
    }
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function inviteLink(code) {
    return location.origin + location.pathname + "?code=" + encodeURIComponent(code);
  }

  async function loadState(id) {
    const gid = id || (game && game.id);
    if (!gid) return false;
    try {
      const results = await Promise.all([
        client.from("games").select("*").eq("id", gid).maybeSingle(),
        client.from("players").select("*").eq("game_id", gid).order("seat")
      ]);
      const g = results[0];
      const p = results[1];
      if (g.error || p.error || !g.data) return false;
      game = g.data;
      players = p.data || [];
      return true;
    } catch (e) {
      return false;
    }
  }
  async function refresh() {
    if (!(await loadState())) return;
    const snap = JSON.stringify([game, players]);
    if (snap !== lastSnap) {
      lastSnap = snap;
      if (screen === "game") render();
    }
  }
  function subscribe(id) {
    if (channel) { client.removeChannel(channel); channel = null; }
    channel = client
      .channel("game-" + id)
      .on("postgres_changes", { event: "*", schema: "public", table: "games", filter: "id=eq." + id }, refresh)
      .on("postgres_changes", { event: "*", schema: "public", table: "players", filter: "game_id=eq." + id }, refresh)
      .subscribe();
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(refresh, 4000);
  }
  async function enterGame(id) {
    const ok = await loadState(id);
    if (!ok) return false;
    lastSnap = JSON.stringify([game, players]);
    lastScores = {};
    store("tod_game_id", game.id);
    try { history.replaceState(null, "", location.pathname + "?code=" + encodeURIComponent(game.code)); } catch (e) {}
    screen = "game";
    showGiveCustom = false;
    subscribe(game.id);
    render();
    return true;
  }

  function header() { return "<h1>💌 Truth or Dare</h1>"; }
  function footer(withNew) {
    return '<div class="footer"><button class="linkbtn" data-action="openAdd">Add questions</button>' +
      (withNew ? '<button class="linkbtn" data-action="newGame">New Game</button>' : "") + "</div>";
  }

  function viewHome() {
    return header() + '<p class="sub">A private game for two</p>' +
      '<div class="card"><button class="btn" data-action="goCreate">Create Game</button></div>' +
      '<div class="card"><p class="label">Have a room code?</p>' +
      '<input type="text" id="codeInput" placeholder="Enter code" autocapitalize="characters" autocomplete="off" maxlength="20">' +
      '<div class="gap"></div><button class="btn ghost" data-action="goJoinCode">Join Game</button></div>' +
      footer(false);
  }
  function viewName() {
    const joining = pendingAction === "join";
    let html = header() +
      '<p class="sub">' + (joining ? "Room " + esc(joinCode) : "Create a private room") + "</p>" +
      '<div class="card"><p class="label">What is your name?</p>' +
      '<input type="text" id="nameInput" maxlength="20" placeholder="Your name" autocomplete="off">';
    if (!joining) {
      html += '<div class="gap"></div><p class="label">Owner passcode</p>' +
        '<input type="password" id="passInput" placeholder="Owner passcode" autocomplete="off" value="' + esc(ownerPass) + '">' +
        '<p class="hint">Only the owner has this passcode.</p>';
    }
    html += '<div class="gap"></div><button class="btn" data-action="submitName">' + (joining ? "Join Game" : "Next") + "</button>" +
      '<div class="gap"></div><button class="btn ghost" data-action="back">Back</button></div>';
    return html;
  }

  function catCount(cat, kind) {
    if (!pickerQuestions) return 0;
    return pickerQuestions.filter(function (q) { return q.category === cat && (!kind || q.kind === kind); }).length;
  }
  function selectedCatsList() {
    return CATS.filter(function (c) { return setupCats[c]; });
  }
  function poolForSelectedCats() {
    if (!pickerQuestions) return [];
    const cats = selectedCatsList();
    return pickerQuestions.filter(function (q) { return cats.indexOf(q.category) !== -1; });
  }
  function manualCount() {
    return Object.keys(manualPicks).filter(function (k) { return manualPicks[k]; }).length;
  }
  function viewSetup() {
    let html = header() + '<p class="sub">Choose your questions</p>';
    html += '<div class="card"><p class="label">Categories (mix any you like)</p><div class="chiprow">';
    CATS.forEach(function (c) {
      const on = setupCats[c];
      html += '<button class="chip' + (on ? " on" : "") + '" data-action="toggleCat" data-cat="' + c + '">' +
        (on ? "✓ " : "") + esc(CATLABEL[c]) + "</button>";
    });
    html += "</div>";
    if (pickerQuestions) {
      const n = poolForSelectedCats().length;
      html += '<p class="hint">' + n + " question" + (n === 1 ? "" : "s") + " available in the categories you picked.</p>";
    } else {
      html += '<p class="hint">Loading your questions...</p>';
    }
    html += "</div>";

    html += '<div class="card"><p class="label">How many questions?</p><div class="segrow">' +
      '<div class="seg' + (setupMode === "random" ? " on" : "") + '" data-action="modeRandom">Pick a number</div>' +
      '<div class="seg' + (setupMode === "manual" ? " on" : "") + '" data-action="modeManual">Choose exact ones</div></div>';

    if (setupMode === "random") {
      html += '<div class="gap"></div><input type="number" id="countInput" min="2" max="500" placeholder="e.g. 50" value="' + esc(setupCount) + '">' +
        '<p class="hint">The pool of questions the game can draw from (a mix of Truths and Dares).</p>';
    } else {
      html += '<div class="gap"></div><div class="pickcount">' + manualCount() + " selected</div>";
      if (!pickerQuestions) {
        html += '<p class="hint center">Loading questions...</p>';
      } else {
        const pool = poolForSelectedCats();
        html += '<div class="checklist">';
        let lastCat = null;
        pool.forEach(function (q) {
          if (q.category !== lastCat) {
            lastCat = q.category;
            html += '<div class="cgroup">' + esc(CATLABEL[q.category] || q.category) + "</div>";
          }
          const checked = manualPicks[q.id] ? " checked" : "";
          html += '<label class="citem"><input type="checkbox" data-action="toggleQ" data-qid="' + q.id + '"' + checked + '>' +
            '<span><span class="ckind ' + q.kind + '">' + q.kind.toUpperCase() + "</span>" + esc(q.text) + "</span></label>";
        });
        if (pool.length === 0) html += '<p class="hint center">No questions in these categories yet.</p>';
        html += "</div>";
      }
    }
    html += "</div>";

    html += '<div class="card"><p class="label">Rounds to play</p>' +
      '<input type="number" id="roundsInput" min="2" max="500" placeholder="e.g. 20" value="' + esc(setupRounds) + '">' +
      '<p class="hint">How many turns before the game ends and a winner is announced. Can be less than your pool, so questions don\'t repeat too soon.</p>' +
      '<div class="gap"></div><button class="btn" data-action="startWithSetup">Create Game</button>' +
      '<div class="gap"></div><button class="btn ghost" data-action="skipSetup">Use every question in these categories</button>' +
      '<div class="gap"></div><button class="btn ghost" data-action="back">Back</button></div>';
    return html;
  }

  function viewLobby() {
    const link = inviteLink(game.code);
    return header() + '<p class="sub">Your room is ready</p>' +
      '<div class="card"><p class="label">Send this link to your friend</p>' +
      '<input type="text" id="linkBox" readonly value="' + esc(link) + '">' +
      '<div class="gap"></div><button class="btn" data-action="share">Share invite</button>' +
      '<div class="gap"></div><button class="btn ghost" data-action="copy">Copy link</button>' +
      '<p class="hint center">Or give them this room code:</p><div class="code">' + esc(game.code) + "</div></div>" +
      '<div class="card center"><p class="waiting">Waiting for your friend<span class="dots">...</span></p></div>' +
      footer(false);
  }
  function deletePoolCount() {
    return Object.keys(deletePicks).filter(function (k) { return deletePicks[k]; }).length;
  }
  function poolForDeleteCats() {
    if (!pickerQuestions) return [];
    const cats = CATS.filter(function (c) { return deleteCats[c]; });
    return pickerQuestions.filter(function (q) { return cats.indexOf(q.category) !== -1; });
  }
  function viewAdd() {
    let html = header() + '<p class="sub">' + (addMode === "add" ? "Add your own questions" : "Delete questions") + '</p>';
    html += '<div class="card"><div class="segrow">' +
      '<div class="seg' + (addMode === "add" ? " on" : "") + '" data-action="addModeAdd">Add</div>' +
      '<div class="seg' + (addMode === "delete" ? " on" : "") + '" data-action="addModeDelete">Delete</div></div></div>';

    if (addMode === "add") {
      html += '<div class="card"><p class="label">Type</p>' +
        '<div class="row2 tight">' +
        '<button class="btn ' + (addKind === "truth" ? "truth" : "ghost") + '" data-action="kindTruth">💗 Truth</button>' +
        '<button class="btn ' + (addKind === "dare" ? "dare" : "ghost") + '" data-action="kindDare">🔥 Dare</button></div>' +
        '<div class="gap"></div><p class="label">Category</p><div class="chiprow">' +
        CATS.map(function (c) {
          const on = addCategory === c;
          return '<button class="chip' + (on ? " on" : "") + '" data-action="setAddCat" data-cat="' + c + '">' + (on ? "✓ " : "") + esc(CATLABEL[c]) + "</button>";
        }).join("") +
        '</div><div class="gap"></div><p class="label">Questions (one on each line)</p>' +
        '<textarea id="addText" rows="8" placeholder="Paste or type your questions here, one on each line"></textarea>' +
        '<div class="gap"></div><p class="label">Owner passcode</p>' +
        '<input type="password" id="addPass" placeholder="Owner passcode" autocomplete="off" value="' + esc(ownerPass) + '">' +
        '<div class="gap"></div><button class="btn" data-action="submitAdd">Add questions</button>' +
        '<div class="gap"></div><button class="btn ghost" data-action="closeAdd">Back</button></div>';
    } else {
      html += '<div class="card"><p class="label">Categories</p><div class="chiprow">';
      CATS.forEach(function (c) {
        const on = deleteCats[c];
        html += '<button class="chip' + (on ? " on" : "") + '" data-action="toggleDelCat" data-cat="' + c + '">' +
          (on ? "✓ " : "") + esc(CATLABEL[c]) + "</button>";
      });
      html += "</div>";
      if (!pickerQuestions) {
        html += '<p class="hint center">Loading questions...</p>';
      } else {
        const pool = poolForDeleteCats();
        html += '<div class="pickcount">' + deletePoolCount() + " selected to delete</div>" + '<div class="checklist">';
        let lastCat = null;
        pool.forEach(function (q) {
          if (q.category !== lastCat) {
            lastCat = q.category;
            html += '<div class="cgroup">' + esc(CATLABEL[q.category] || q.category) + "</div>";
          }
          const checked = deletePicks[q.id] ? " checked" : "";
          html += '<label class="citem"><input type="checkbox" data-action="toggleDel" data-qid="' + q.id + '"' + checked + '>' +
            '<span><span class="ckind ' + q.kind + '">' + q.kind.toUpperCase() + "</span>" + esc(q.text) + "</span></label>";
        });
        if (pool.length === 0) html += '<p class="hint center">No questions in these categories.</p>';
        html += "</div>";
      }
      html += '<div class="gap"></div><p class="label">Owner passcode</p>' +
        '<input type="password" id="delPass" placeholder="Owner passcode" autocomplete="off" value="' + esc(ownerPass) + '">' +
        '<p class="hint">Deleted questions are gone for good, from every game.</p>' +
        '<div class="gap"></div><button class="btn" data-action="submitDelete">Delete selected</button>' +
        '<div class="gap"></div><button class="btn ghost" data-action="closeAdd">Back</button></div>';
    }
    return html;
  }
  function viewError(msg) {
    return header() + '<div class="card center"><p class="label">Could not connect</p><p class="hint">' + esc(msg || "") +
      '</p><button class="btn" data-action="retry">Try again</button></div>';
  }
  function detectScores() {
    const bumped = {};
    players.forEach(function (p) {
      if (p.id in lastScores && p.score !== lastScores[p.id]) {
        bumped[p.id] = true;
        const diff = p.score - lastScores[p.id];
        if (diff > 0) toast("🎉 " + p.name + " earned +" + diff + "!");
        else if (diff < 0) toast("😬 " + p.name + " lost " + Math.abs(diff) + " for skipping");
      }
      lastScores[p.id] = p.score;
    });
    return bumped;
  }
  function viewFinished() {
    const sorted = players.slice().sort(function (a, b) { return b.score - a.score; });
    const tie = sorted.length === 2 && sorted[0].score === sorted[1].score;
    let html = header() + '<div class="card center"><div class="dragon">🐉✨</div>';
    if (tie) {
      html += '<p class="winnername">It\'s a dragon draw! 🤝</p><p class="hint">Both scored ' + sorted[0].score + " points.</p>";
    } else {
      html += '<p class="hint" style="margin-bottom:0">The winner is...</p><p class="winnername">' + esc(sorted[0].name) + " 🐉👑</p>" +
        '<p class="hint">' + sorted[0].score + " points, well earned!</p>";
    }
    html += "</div>";
    html += '<div class="scores">';
    sorted.forEach(function (p, i) {
      html += '<div class="score' + (i === 0 && !tie ? " winner" : "") + '"><div class="pname">' + esc(p.name) + "</div>" +
        '<div class="pts">' + p.score + "</div></div>";
    });
    html += "</div>" + footer(true);
    return html;
  }
  function viewGame() {
    if (game.phase === "finished") return viewFinished();

    const me = players.find(function (p) { return p.user_id === userId; });
    const turnP = players.find(function (p) { return p.seat === game.turn_seat; });
    const otherP = players.find(function (p) { return p.seat !== game.turn_seat; });
    const myTurn = !!(me && turnP && me.id === turnP.id);
    const turnName = turnP ? turnP.name : "Someone";
    const otherName = otherP ? otherP.name : "your friend";
    const bumped = detectScores();

    let html = header();
    if (game.question_limit) {
      html += '<p class="progress">Question ' + Math.min(game.questions_used + 1, game.question_limit) + " of " + game.question_limit + "</p>";
    }
    html += '<div class="scores">';
    players.forEach(function (p) {
      const active = turnP && p.id === turnP.id ? " active" : "";
      const you = me && p.id === me.id ? " (you)" : "";
      html += '<div class="score' + active + '"><div class="pname">' + esc(p.name) + you + "</div>" +
        '<div class="pts' + (bumped[p.id] ? " bump" : "") + '">' + p.score + "</div></div>";
    });
    html += "</div>";

    if (game.phase === "choosing") {
      lastQuestionKey = "";
      if (myTurn) {
        html += '<div class="card center"><p class="turn">Your turn! ✨</p><p class="hint">Pick one</p>' +
          '<div class="row2"><button class="btn truth" data-action="pick" data-kind="truth">💗 TRUTH</button>' +
          '<button class="btn dare" data-action="pick" data-kind="dare">🔥 DARE</button></div></div>';
      } else {
        html += '<div class="card center"><p class="turn">' + esc(turnName) + "'s turn</p>" +
          '<p class="waiting">Waiting for them to choose<span class="dots">...</span></p></div>';
      }
    } else if (game.phase === "awaiting_question") {
      lastQuestionKey = "";
      const kind = game.current_kind === "dare" ? "dare" : "truth";
      const kindLabel = kind === "dare" ? "Dare" : "Truth";
      if (myTurn) {
        html += '<div class="card center"><p class="turn">You chose ' + (kind === "dare" ? "🔥" : "💗") + " " + kindLabel + "</p>" +
          '<p class="waiting">Waiting for ' + esc(otherName) + " to send you one" + '<span class="dots">...</span></p></div>';
      } else if (!showGiveCustom) {
        html += '<div class="card center"><p class="turn">' + esc(turnName) + " chose " + (kind === "dare" ? "🔥" : "💗") + " " + kindLabel + "</p>" +
          '<p class="hint">Give them a random one, or write your own</p>' +
          '<button class="btn ' + kind + '" data-action="giveRandom">🎲 Random ' + kindLabel + "</button>" +
          '<div class="gap"></div><button class="btn ghost" data-action="showGive">✏️ Write my own ' + kindLabel + '</button></div>';
      } else {
        html += '<div class="card"><p class="label">Write your own ' + kindLabel + ' for ' + esc(turnName) + '</p>' +
          '<textarea id="customText" rows="3" maxlength="500" placeholder="Type your question or dare..."></textarea>' +
          '<div class="gap"></div><button class="btn" data-action="submitGive">Send it</button>' +
          '<div class="gap"></div><button class="btn ghost" data-action="hideGive">Back</button></div>';
      }
    } else {
      const kind = game.current_kind === "dare" ? "dare" : "truth";
      const isTruth = kind === "truth";
      const answer = game.current_answer;
      const qKey = game.id + ":" + game.current_question_text;
      const pop = qKey !== lastQuestionKey ? " pop" : "";
      lastQuestionKey = qKey;
      html += '<div class="card qcard' + pop + '"><span class="badge ' + kind + '">' + kind.toUpperCase() + "</span>" +
        '<div class="qtext">' + esc(game.current_question_text) + "</div></div>";
      if (isTruth && answer) {
        html += '<div class="card answer"><p class="alabel">💬 ' + esc(turnName) + "'s answer</p>" +
          '<div class="atext">' + esc(answer) + "</div></div>";
      }
      if (game.is_repeat_round) {
        html += '<p class="hint center">🔁 This is the question you asked back — no points for completing it, but skipping still costs 2.</p>';
      }
      const alreadySaved = game.repeat_seat === (me && me.seat) && game.repeat_kind === game.current_kind;
      const repeatBtn = alreadySaved
        ? '<p class="hint center">✅ Saved — they\'ll get this the moment this round ends</p>'
        : '<button class="linkbtn" data-action="saveRepeat">🔁 Ask them this too</button>';
      if (myTurn) {
        if (isTruth && !answer) {
          html += '<div class="card"><p class="label">Your answer</p>' +
            '<textarea id="answerBox" rows="4" maxlength="500" placeholder="Type your answer here..."></textarea>' +
            '<div class="gap"></div><button class="btn" data-action="sendAnswer">Send answer</button>' +
            '<div class="gap"></div><button class="btn ghost" data-action="skip">Skip (-2 points)</button>' +
            repeatBtn + '</div>';
        } else {
          html += '<div class="card center"><p class="waiting">' + (isTruth ? "Answer sent! Waiting for " : "Do it, then wait for ") +
            esc(otherName) + ' to confirm<span class="dots">...</span></p>' +
            '<button class="btn ghost" data-action="skip">Skip (-2 points)</button>' +
            repeatBtn + '</div>';
        }
      } else {
        if (isTruth && !answer) {
          html += '<div class="card center"><p class="waiting">' + esc(turnName) +
            ' is typing an answer<span class="dots">...</span></p></div>';
        } else {
          const pts = game.is_repeat_round ? 0 : (isTruth ? 5 : 6);
          const completeLabel = game.is_repeat_round ? "Completed" : ("Completed +" + pts);
          html += '<div class="card center"><p class="hint">' + esc(turnName) +
            (isTruth ? " answered. Happy with it?" : " is doing this. Did they do it?") + "</p>" +
            '<button class="btn green" data-action="complete">' + completeLabel + '</button></div>';
        }
      }
    }
    html += footer(true);
    return html;
  }

  function render() {
    let key = screen;
    let html = "";
    if (screen === "loading") html = header() + '<p class="sub">Loading...</p>';
    else if (screen === "home") html = viewHome();
    else if (screen === "name") html = viewName();
    else if (screen === "setup") html = viewSetup();
    else if (screen === "add") html = viewAdd();
    else if (screen === "error") html = viewError(window.__err);
    else if (screen === "game" && game) {
      if (game.status === "waiting") { key = "lobby:" + game.id; html = viewLobby(); }
      else { key = "game:" + game.id + ":" + game.phase + ":" + showGiveCustom; html = viewGame(); }
    }
    const oldBox = document.getElementById("answerBox");
    const draftAns = oldBox ? oldBox.value : "";
    const oldCustom = document.getElementById("customText");
    const draftCustom = oldCustom ? oldCustom.value : "";
    const oldList = document.querySelector(".checklist");
    const scrollTop = oldList ? oldList.scrollTop : 0;
    app.className = key !== lastScreenKey ? "enter" : "";
    lastScreenKey = key;
    app.innerHTML = html;
    const newBox = document.getElementById("answerBox");
    if (newBox && draftAns) newBox.value = draftAns;
    const newCustom = document.getElementById("customText");
    if (newCustom && draftCustom) newCustom.value = draftCustom;
    const newList = document.querySelector(".checklist");
    if (newList && scrollTop) newList.scrollTop = scrollTop;
  }

  async function loadPicker() {
    if (pickerQuestions || pickerLoading) return;
    pickerLoading = true;
    const res = await client.rpc("list_questions_for_picker", { kinds: ["truth", "dare"], categories: null });
    pickerLoading = false;
    if (!res.error) {
      pickerQuestions = res.data || [];
      if (screen === "setup" || screen === "add") render();
    }
  }

  async function submitName() {
    const input = document.getElementById("nameInput");
    const name = (input ? input.value : "").trim();
    if (!name) { toast("Please type your name"); return; }
    store("tod_name", name);
    if (pendingAction === "join") {
      const res = await rpc("join_game", { game_code: joinCode, player_name: name });
      if (res.error) { toast(res.error.message); return; }
      const ok = await enterGame(res.data);
      if (!ok) toast("Could not open the game. Please try again.");
      return;
    }
    const passInput = document.getElementById("passInput");
    draftName = name;
    draftPass = passInput ? passInput.value : "";
    if (!draftPass) { toast("Please enter the owner passcode"); return; }
    screen = "setup";
    render();
    loadPicker();
  }

  function toggleCat(c) { setupCats[c] = !setupCats[c]; render(); }
  function setMode(m) { setupMode = m; render(); if (m === "manual") loadPicker(); }

  async function createWithIds(ids, limit) {
    const res = await rpc("create_game", { player_name: draftName, passcode: draftPass, q_limit: limit, q_ids: ids });
    if (res.error) { toast(res.error.message); return; }
    ownerPass = draftPass;
    manualPicks = {};
    const ok = await enterGame(res.data);
    if (!ok) toast("Could not open the game. Please try again.");
  }
  function readRounds(fallback) {
    const raw = document.getElementById("roundsInput");
    const n = raw ? parseInt(raw.value, 10) : NaN;
    if (!n || n < 2) return fallback;
    return n;
  }
  async function startWithSetup() {
    if (setupMode === "random") {
      const n = parseInt(document.getElementById("countInput").value, 10);
      if (!n || n < 2) { toast("Please enter a pool size of at least 2"); return; }
      if (!pickerQuestions) { toast("Still loading questions, try again in a second"); return; }
      const pool = poolForSelectedCats();
      if (pool.length < 2) { toast("Not enough questions in those categories"); return; }
      const ids = shuffle(pool.map(function (q) { return q.id; })).slice(0, Math.min(n, pool.length));
      if (n > pool.length) toast("Only " + pool.length + " questions available in the pool");
      const rounds = readRounds(ids.length);
      await createWithIds(ids, rounds);
    } else {
      const ids = Object.keys(manualPicks).filter(function (k) { return manualPicks[k]; }).map(Number);
      if (ids.length < 2) { toast("Please tick at least 2 questions"); return; }
      const rounds = readRounds(ids.length);
      await createWithIds(ids, rounds);
    }
  }
  async function skipSetup() {
    const rounds = readRounds(null);
    await createWithIds(null, rounds);
  }
  async function pick(kind) {
    const res = await rpc("pick_kind", { gid: game.id, chosen_kind: kind });
    if (res.error) toast(res.error.message);
    showGiveCustom = false;
    await refresh();
    render();
  }
  async function giveRandom() {
    const res = await rpc("assign_question", { gid: game.id });
    if (res.error) toast(res.error.message);
    showGiveCustom = false;
    await refresh();
    render();
  }
  async function submitGive() {
    const ta = document.getElementById("customText");
    const text = (ta ? ta.value : "").trim();
    if (!text) { toast("Please type a question first"); return; }
    const res = await rpc("assign_question", { gid: game.id, custom_text: text });
    if (res.error) toast(res.error.message);
    showGiveCustom = false;
    await refresh();
    render();
  }
  async function sendAnswer() {
    const box = document.getElementById("answerBox");
    const text = (box ? box.value : "").trim();
    if (!text) { toast("Please type your answer first"); return; }
    const res = await rpc("submit_answer", { gid: game.id, answer_text: text });
    if (res.error) toast(res.error.message);
    await refresh();
    render();
  }
  async function complete() {
    const res = await rpc("complete_challenge", { gid: game.id });
    if (res.error) toast(res.error.message);
    await refresh();
    render();
  }
  async function skip() {
    const res = await rpc("skip_challenge", { gid: game.id });
    if (res.error) toast(res.error.message);
    await refresh();
    render();
  }
  async function saveRepeat() {
    const res = await rpc("save_repeat", { gid: game.id });
    if (res.error) { toast(res.error.message); return; }
    toast("🔁 Saved — they'll get this the moment this round ends");
    await refresh();
    render();
  }
  async function newGame() {
    if (!confirm("Start a fresh game? Scores reset and you will get a new invite link to send to your friend.")) return;
    store("tod_game_id", null);
    game = null;
    players = [];
    pendingAction = "create";
    screen = "name";
    render();
  }
  function setKind(k) { addKind = k; render(); }
  function setAddCat(c) { addCategory = c; render(); }
  function toggleDelCat(c) { deleteCats[c] = !deleteCats[c]; render(); }
  async function submitDelete() {
    const pw = document.getElementById("delPass");
    const pass = pw ? pw.value : "";
    const ids = Object.keys(deletePicks).filter(function (k) { return deletePicks[k]; }).map(Number);
    if (!ids.length) { toast("Please tick at least one question to delete"); return; }
    if (!pass) { toast("Please enter the owner passcode"); return; }
    if (!confirm("Delete " + ids.length + " question" + (ids.length === 1 ? "" : "s") + " permanently? This can't be undone.")) return;
    const res = await rpc("delete_questions", { passcode: pass, ids: ids });
    if (res.error) { toast(res.error.message); return; }
    ownerPass = pass;
    deletePicks = {};
    pickerQuestions = null;
    toast("🗑 Deleted " + (res.data || 0) + " question" + (res.data === 1 ? "" : "s"));
    await loadPicker();
  }
  async function submitAdd() {
    const ta = document.getElementById("addText");
    const pw = document.getElementById("addPass");
    const text = ta ? ta.value : "";
    const pass = pw ? pw.value : "";
    const total = text.split(/\r?\n/).filter(function (l) { return l.trim() !== ""; }).length;
    if (!total) { toast("Please type or paste at least one question"); return; }
    if (!pass) { toast("Please enter the owner passcode"); return; }
    const res = await rpc("add_questions", { passcode: pass, q_kind: addKind, q_text: text, q_category: addCategory });
    if (res.error) { toast(res.error.message); return; }
    ownerPass = pass;
    pickerQuestions = null;
    const added = res.data || 0;
    const skipped = total - added;
    toast("✅ Added " + added + " new " + addKind + " question" + (added === 1 ? "" : "s") +
      (skipped > 0 ? " (" + skipped + " skipped: duplicates or too long)" : ""));
    if (ta) ta.value = "";
  }
  async function copyText(t) {
    try {
      await navigator.clipboard.writeText(t);
      toast("Link copied ✅");
    } catch (e) {
      const box = document.getElementById("linkBox");
      if (box) { box.focus(); box.select(); box.setSelectionRange(0, 9999); }
      toast("Touch and hold the link, then tap Copy");
    }
  }
  async function shareInvite() {
    const link = inviteLink(game.code);
    if (navigator.share) {
      try {
        await navigator.share({ title: "Truth or Dare", text: "Join my private Truth or Dare game! 💌", url: link });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    copyText(link);
  }

  document.addEventListener("click", function (e) {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const a = el.dataset.action;
    if (a === "goCreate") { pendingAction = "create"; screen = "name"; render(); }
    else if (a === "goJoinCode") {
      const input = document.getElementById("codeInput");
      const v = (input ? input.value : "").trim().toUpperCase();
      if (!v) { toast("Please enter the room code"); return; }
      joinCode = v; pendingAction = "join"; screen = "name"; render();
    }
    else if (a === "back") { screen = pendingAction === "join" || screen === "name" ? "home" : "name"; render(); }
    else if (a === "submitName") submitName();
    else if (a === "toggleCat") toggleCat(el.dataset.cat);
    else if (a === "modeRandom") setMode("random");
    else if (a === "modeManual") setMode("manual");
    else if (a === "startWithSetup") startWithSetup();
    else if (a === "skipSetup") skipSetup();
    else if (a === "pick") pick(el.dataset.kind);
    else if (a === "giveRandom") giveRandom();
    else if (a === "showGive") { showGiveCustom = true; render(); }
    else if (a === "hideGive") { showGiveCustom = false; render(); }
    else if (a === "submitGive") submitGive();
    else if (a === "sendAnswer") sendAnswer();
    else if (a === "complete") complete();
    else if (a === "skip") skip();
    else if (a === "saveRepeat") saveRepeat();
    else if (a === "newGame") newGame();
    else if (a === "openAdd") { addReturn = screen === "game" ? "game" : "home"; screen = "add"; addMode = "add"; render(); loadPicker(); }
    else if (a === "closeAdd") { screen = addReturn; render(); }
    else if (a === "kindTruth") setKind("truth");
    else if (a === "kindDare") setKind("dare");
    else if (a === "setAddCat") setAddCat(el.dataset.cat);
    else if (a === "submitAdd") submitAdd();
    else if (a === "addModeAdd") { addMode = "add"; render(); }
    else if (a === "addModeDelete") { addMode = "delete"; render(); loadPicker(); }
    else if (a === "toggleDelCat") toggleDelCat(el.dataset.cat);
    else if (a === "submitDelete") submitDelete();
    else if (a === "share") shareInvite();
    else if (a === "copy") copyText(inviteLink(game.code));
    else if (a === "retry") location.reload();
  });
  document.addEventListener("change", function (e) {
    if (!e.target || !e.target.dataset) return;
    if (e.target.dataset.action === "toggleQ") {
      manualPicks[e.target.dataset.qid] = e.target.checked;
      render();
    } else if (e.target.dataset.action === "toggleDel") {
      deletePicks[e.target.dataset.qid] = e.target.checked;
      render();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "nameInput" || e.target.id === "passInput") submitName();
    if (e.target.id === "codeInput") {
      const btn = document.querySelector('[data-action="goJoinCode"]');
      if (btn) btn.click();
    }
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && screen === "game") refresh();
  });

  async function boot() {
    render();
    try {
      let sessionResult = await client.auth.getSession();
      let session = sessionResult.data.session;
      if (!session) {
        const signIn = await client.auth.signInAnonymously();
        if (signIn.error) throw signIn.error;
        session = signIn.data.session;
      }
      userId = session.user.id;
    } catch (e) {
      window.__err = (e && e.message) || String(e);
      screen = "error";
      render();
      return;
    }

    const code = (new URLSearchParams(location.search).get("code") || "").trim().toUpperCase();
    if (code) {
      let existing = null;
      try {
        const r = await client.from("games").select("id").eq("code", code).maybeSingle();
        existing = r.data;
      } catch (e) {}
      if (existing && (await enterGame(existing.id))) return;
      joinCode = code;
      pendingAction = "join";
      screen = "name";
      render();
      return;
    }

    const saved = load("tod_game_id");
    if (saved) {
      const ok = await loadState(saved);
      if (ok && game.phase !== "finished") {
        await enterGame(saved);
        return;
      }
      store("tod_game_id", null);
      game = null;
      players = [];
    }
    screen = "home";
    render();
  }
  boot();
</script>
</body>
</html>
